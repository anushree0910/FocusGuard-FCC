<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusGuard | Sign in</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="logo" aria-hidden="true">&#9673;</div>
      <p class="brand">FOCUSGUARD</p>
      <h1>Make room for focus.</h1>
      <p class="subtitle">A calmer way to get things done</p>

      <form id="login-form" action="#" method="post">
        <div class="form-group">
          <div class="field-row">
            <label class="field-label" for="email">Email address</label>
          </div>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        </div>

        <div class="form-group">
          <div class="field-row">
            <label class="field-label" for="password">Password</label>
            <button type="button" id="toggle-password" class="toggle" data-target="password">Show</button>
          </div>
          <input type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password" required>
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="remember" name="remember">
          <label for="remember">Remember my email</label>
        </div>

        <p class="error-message" id="login-error">&nbsp;</p>

        <button type="submit" class="btn btn-primary">Sign in</button>
        <a href="register.html" class="btn btn-secondary">Create an account</a>
      </form>
    </section>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
